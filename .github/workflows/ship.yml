name: Build APK
on: [push]
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: android debug
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Package
          path: bin/*.apk
