name: Build with Buildozer
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        run: |
          docker run --rm --user root -v ${{ github.workspace }}:/home/user/hostcwd -w /home/user/hostcwd --entrypoint /bin/sh kivy/buildozer -c "yes | buildozer android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Package
          path: bin/*.apk
