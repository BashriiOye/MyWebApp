name: Build with Buildozer
on: [push]
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Buildozer
        run: |
          docker run --rm -v ${{ github.workspace }}:/home/user/hostcwd kivy/buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Package
          path: bin/*.apk
